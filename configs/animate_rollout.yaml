# animate_rollout.py; override with key=value on the command line

policy: scripted_flip     # zero, hover, random, scripted_<task>, or a model in models/
seed: 0
save: null                # e.g. plots/flip.gif
plan: true                # tdmpc2: false = policy prior only
start_pause: 0.7          # s on the first frame
drone_from: null          # fly on another model's drone, e.g. ppo_flip_dr
plots: true               # false = MuJoCo view only

scripted:                 # baseline controllers
  pd_kp: 4.0              # 1/s^2
  pd_kd: 3.0              # 1/s
  att_gain: 8.0           # 1/s
  flip_climb_time: 0.08   # s at full thrust before rolling
  flip_thrust: -0.2       # action thrust while rolling
