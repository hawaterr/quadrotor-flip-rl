# animate_rollout.py. Override on the command line, e.g.
#   python animate_rollout.py policy=tdmpc2_flip plan=false save=plots/flip.gif

policy: scripted_flip     # zero, hover, random, scripted_<task>, or any model in models/ (ppo_*, tdmpc2_*)
seed: 0                   # seed of the episode's starting state
save: null                # e.g. plots/flip.gif to also save the animation
plan: true                # tdmpc2_*: false acts with the policy prior alone, without MPPI
start_pause: 0.7          # s to hold the first frame (t = 0), so the starting position is easy to see
plots: true               # false: MuJoCo view alone, without the plots and status text

# Hand-written baseline controllers (scripted_hover / scripted_flip)
scripted:
  pd_kp: 4.0              # 1/s^2, position gain of the cascaded PD controller
  pd_kd: 3.0              # 1/s, velocity gain
  att_gain: 8.0           # 1/s, body rate per unit of attitude error
  flip_climb_time: 0.08   # s at full thrust before rolling; motors at full thrust can't start a roll quickly, so a
                          #   longer climb overshoots the start point by metres
  flip_thrust: 0.2        # action thrust while rolling (above hover: the motors make more torque there)
