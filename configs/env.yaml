# Simulator, tasks and rewards, shared by PPO and TD-MPC2

dynamics:
  mass: 0.8                       # kg
  inertia: [0.005, 0.005, 0.009]  # kg m^2, body x/y/z
  thrust_to_weight: 4.0
  max_rate: 15.0                  # rad/s, max commanded body rate
  rate_kp: [25.0, 25.0, 20.0]     # 1/s, rate controller gains (roll, pitch, yaw)
  thrust_tau: 0.03                # s, motor lag
  arm_length: 0.1                 # m, X layout
  yaw_torque_per_thrust: 0.016    # m
  drag: [0.4, 0.4, 0.1]           # 1/s, linear drag per body axis
  sim_dt: 0.002                   # s, physics step

policy_dt: 0.02                   # s between policy actions (50 Hz)
latency: [0.005, 0.03]            # s, [min, max], drawn per episode; [0, 0] = none
target: [0.0, 0.0, 3.0]           # m, hover target / flip start point

randomisation:                    # [min, max] x nominal, drawn per episode; null = off
  hover_thrust: [0.85, 1.15]
  thrust_curve: [0.0, 0.5]        # absolute, 0 = linear
  inertia: [0.7, 1.4]
  motor_tau: [0.7, 1.5]
  drag_xy: [0.6, 1.6]
  drag_z: [0.5, 2.0]
  critic_params: true             # critic also sees the drawn values

history: 10                       # policy steps of [gyro, accel, action] in the observation
obs_scale:                        # observations are divided by these; changing them needs retraining
  body_rate: 10.0                 # rad/s
  velocity: 5.0                   # m/s
  position: 2.0                   # m
sensors:
  gyro_noise: 0.05                # rad/s, std
  gyro_bias: 0.02                 # rad/s, max per episode
  accel_noise: 0.3                # m/s^2, std
  accel_bias: 0.1                 # m/s^2, max per episode
  att_init_std: 0.02              # rad, initial attitude estimate error

hover:
  episode_time: 5.0               # s
  max_dist: 3.0                   # m from the target
  min_height: 0.5                 # m
  start:
    tilt_std: 0.2                 # rad
    pos_range: 0.5                # m
    v_std: 0.3                    # m/s
    w_std: 0.5                    # rad/s
    min_std: 0.1                  # minimum v/w spread in training
  reward:                         # per step
    alive: 1.0
    dist: 0.5                     # * distance to target [m]
    upright: 0.2                  # * R[2,2]
    body_rate: 0.05               # * |body rate|
    speed: 0.05                   # * |velocity|
    smooth: 0.01                  # * ||action change||^2
    crash: 10.0                   # once

flip:
  episode_time: 1.5               # s, flip + recovery, then the pilot takes over
  max_dist: 6.0                   # m from the start point
  min_height: 0.5                 # m
  start:
    tilt_std: 0.03                # rad
    pos_range: 0.0                # m
    v_std: 0.1                    # m/s
    w_std: 0.1                    # rad/s
    min_std: 0.1                  # minimum v/w spread in training
  mid_flip:                       # training only: start part-way through a roll
    prob: 0.5
    max_angle_frac: 0.9           # of a revolution
    roll_rate: 10.0               # rad/s
    rate_std: 0.5                 # rad/s
    climb_speed: 2.0              # m/s
    climb_std: 0.3                # m/s
  reward:                         # per step
    roll_progress: 3.0            # * new roll progress [rad]
    done_frac: 0.95               # of a revolution counts as done
    completion_bonus: 10.0        # once
    upright: 0.5                  # * R[2,2]
    target: 1.0                   # * exp(-dist / target_scale)
    target_scale: 0.5             # m
    handover: 20.0                # once at the end: * exp(-dist / handover_scale)
    handover_scale: 0.2           # m
    still: 1.0                    # * exp(-|velocity| / still_scale)
    still_scale: 2.0              # m/s
    body_rate: 0.05               # * |body rate|
    speed: 0.2                    # * min(|velocity|, speed_cap)
    speed_cap: 1.0                # m/s
    thrust_effort: 0.1            # * thrust_action^2
    free_dist: 3.0                # m from the start that cost nothing
    dist: 0.5                     # * distance beyond free_dist
    smooth: 0.1                   # * ||action change||^2
    crash: 10.0                   # once
