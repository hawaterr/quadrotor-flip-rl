# Simulator, tasks and rewards. Shared by PPO and TD-MPC2.
# A trained model saves the config it was trained with, so editing this file doesn't change
# how existing models are evaluated.

dynamics:
  mass: 0.8                       # kg
  inertia: [0.005, 0.005, 0.009]  # kg m^2, body x/y/z
  thrust_to_weight: 4.0           # max collective thrust / weight
  max_rate: 15.0                  # rad/s, max commanded body rate
  rate_kp: [40.0, 40.0, 20.0]     # 1/s, rate controller gains (roll, pitch, yaw)
  thrust_tau: 0.03                # s, motor (thrust) time constant
  sim_dt: 0.002                   # s, physics step

policy_dt: 0.01                   # s between policy actions (100 Hz); each action is held for policy_dt / sim_dt
                                  # physics steps. An algorithm config can override it (TD-MPC2 uses 0.02)
target: [0.0, 0.0, 3.0]           # m, hover target / flip start point

hover:
  episode_time: 5.0               # s
  max_dist: 3.0                   # m from the target before the episode ends
  min_height: 0.5                 # m, below this counts as a crash
  start:                          # random start around the target
    tilt_std: 0.2                 # rad, random tilt (axis-angle)
    pos_range: 0.5                # m, uniform offset per axis
    v_std: 0.3                    # m/s
    w_std: 0.5                    # rad/s
    min_std: 0.1                  # minimum v/w spread in training (evaluation with exact=True drops it)
  reward:                         # per control step
    alive: 1.0                    # constant, so surviving is always worth it
    dist: 0.5                     # * distance to target [m]
    upright: 0.2                  # * R[2,2] (1 = level)
    body_rate: 0.05               # * |body rate| [rad/s]
    speed: 0.05                   # * |velocity| [m/s]
    smooth: 0.01                  # * ||action - previous action||^2
    crash: 10.0                   # once, on termination

flip:
  episode_time: 3.0               # s; the flip takes ~0.5 s, the rest is time to fly back and settle
  max_dist: 6.0                   # m from the start point (a flip needs room to climb first)
  min_height: 0.5                 # m
  start:                          # starts at rest
    tilt_std: 0.0
    pos_range: 0.0
    v_std: 0.0
    w_std: 0.0
    min_std: 0.1                  # small v/w noise in training; evaluation with exact=True starts exactly at rest
  mid_flip:                       # training curriculum: some episodes start part-way through a roll
    prob: 0.5                     # share of training episodes (never used in evaluation)
    max_angle_frac: 0.9           # start angle drawn from [0, 0.9] of a revolution
    roll_rate: 10.0               # rad/s
    rate_std: 0.5                 # rad/s
    climb_speed: 2.0              # m/s upwards, to carry it through
    climb_std: 0.3                # m/s
  reward:                         # per control step
    roll_progress: 3.0            # * new roll progress [rad] (only beyond the furthest point so far)
    done_frac: 0.95               # share of a revolution that counts as a completed flip
    completion_bonus: 10.0        # once, when the flip completes
    upright: 0.5                  # recovery: * R[2,2]
    target: 1.0                   # recovery: * exp(-dist / target_scale); pulls it back to the start point,
    target_scale: 1.0             #   m; largest at the target and never negative, so crashing never pays
    body_rate: 0.05               # recovery: * |body rate| [rad/s]
    speed: 0.2                    # recovery: * min(|velocity|, speed_cap) [m/s]; stops drift and bobbing
    speed_cap: 1.0                # m/s; caps the speed penalty, so a fast drone right after the flip isn't
                                  #   punished so hard that crashing early would pay
    free_dist: 3.0                # m from the start point that is free (whole episode; bounds the climb)
    dist: 0.5                     # * distance beyond free_dist [m]
    # Strong on purpose: the rate controller filters out step-to-step chattering, so with a weak
    # penalty (0.01) the agent learned to chatter almost for free.
    smooth: 0.1                   # * ||action - previous action||^2
    crash: 10.0                   # once, on termination
