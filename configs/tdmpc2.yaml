# TD-MPC2; override with key=value on the command line

task: flip                # flip | hover
train_seed: 0
name: null                # model / log name (default tdmpc2_<task>)

steps: 100000             # env steps
max_minutes: null         # wall-clock limit
save_every: 5000          # env steps between checkpoints
eval_every: 5000          # env steps between evaluations
eval_seeds: [0, 1, 2, 3, 4]
threads: 4                # torch CPU threads
plan_after: null          # step to start acting with MPPI; null = policy prior only in training
update_every: 1           # env steps per gradient update
min_seed_steps: 1000      # random steps before learning: max(min_seed_steps,
seed_episodes: 5          #   seed_episodes * episode length)
log_every_episodes: 10
log_every_steps: 1000

agent:
  # model
  latent_dim: 64          # multiple of simnorm_dim
  mlp_dim: 128
  enc_dim: 128
  num_q: 5                # Q ensemble size
  simnorm_dim: 8
  num_bins: 101           # two-hot bins
  vmin: -10.0             # symlog space
  vmax: 10.0
  dropout: 0.0
  # training
  horizon: 3
  batch_size: 256
  lr: 3e-4
  enc_lr_scale: 0.3
  grad_clip: 20.0
  rho: 0.5                # temporal weight decay
  tau: 0.01               # target Q polyak rate
  discount: 0.99
  consistency_coef: 20.0
  reward_coef: 0.1
  value_coef: 0.1
  termination_coef: 1.0
  entropy_coef: 1e-4
  log_std_min: -10.0
  log_std_max: 2.0
  # planning (MPPI)
  iterations: 4
  num_samples: 256
  num_elites: 64
  num_pi_trajs: 24        # samples from the policy prior
  temperature: 0.5
  min_std: 0.05
  max_std: 2.0

# per-task overrides
hover:
  agent:
    discount: 0.98        # ~1 s horizon at 50 Hz

flip:
  steps: 200000
  agent:
    discount: 0.98
