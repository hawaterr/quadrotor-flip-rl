# TD-MPC2. Override anything on the command line, e.g.
#   python -m tdmpc2.train_tdmpc2 task=flip steps=60000 agent.num_samples=512
# The env settings (env.*) come from env.yaml for the chosen task.

task: hover               # hover | flip
train_seed: 0             # seed of the training run (network init, exploration, env), for reproducible runs

steps: 100000             # env steps to train for
save_every: 5000          # env steps between checkpoints (models/tdmpc2_<task>.pt), to check progress mid-run
eval_every: 2500          # env steps between evaluations, with MPPI and with the policy alone (columns
                          #   return / policy_return ...), logged to results/tdmpc2_<task>.csv
eval_seeds: [0, 1, 2, 3, 4]  # one evaluation episode per seed (start from rest)
threads: 4                # torch CPU threads
plan_after: 0             # act with the policy prior (fast) until this step, then with MPPI
min_seed_steps: 1000      # random-action steps before learning starts: max(min_seed_steps,
seed_episodes: 5          #   seed_episodes * episode length)
log_every_episodes: 10    # console progress line
log_every_steps: 1000     # TensorBoard losses

agent:
  # model
  latent_dim: 64          # size of z; a multiple of simnorm_dim
  mlp_dim: 128            # hidden layer width of all networks except the encoder (sets most of the cost)
  enc_dim: 128            # hidden layer width of the encoder
  num_q: 5                # Q-function ensemble size
  simnorm_dim: 8          # SimNorm group size
  num_bins: 101           # two-hot bins for reward and value
  vmin: -10.0             # two-hot support, in symlog space
  vmax: 10.0
  dropout: 0.0            # paper: 0.01 in Q; dropout's RNG costs ~25% of update time on CPU
  # training
  horizon: 3              # steps the latent dynamics are unrolled for, in training and planning
  batch_size: 256
  lr: 3e-4
  enc_lr_scale: 0.3
  grad_clip: 20.0
  rho: 0.5                # temporal weight decay over the horizon
  tau: 0.01               # target Q polyak rate
  discount: 0.99          # per control step
  consistency_coef: 20.0
  reward_coef: 0.1
  value_coef: 0.1
  termination_coef: 1.0
  entropy_coef: 1e-4
  log_std_min: -10.0
  log_std_max: 2.0
  # planning (MPPI). Halved from the paper's 512 x 6 to keep CPU training to about 10 steps/s
  iterations: 4
  num_samples: 256
  num_elites: 64
  num_pi_trajs: 24        # of num_samples, trajectories proposed by the policy prior
  temperature: 0.5
  min_std: 0.05
  max_std: 2.0

# Per-task overrides of the settings above
hover:
  agent:
    discount: 0.98        # per 0.02 s step (env.policy_dt): a ~1 s horizon, same as PPO

flip:
  steps: 60000            # the last run stopped improving after ~35k steps
  agent:
    discount: 0.98        # per 0.02 s step (env.policy_dt): a ~1 s horizon, same as PPO
