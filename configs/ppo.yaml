# PPO (Stable-Baselines3); override with key=value on the command line

task: flip                # flip | hover
train_seed: 0

steps: 1000000            # env steps
save_every: 100000        # env steps between checkpoints
eval_every: 25000         # env steps between evaluations
eval_seeds: [0, 1, 2, 3, 4]
init_model: null          # model to fine-tune, e.g. models/ppo_flip_v1.zip
name: null                # model name (default ppo_<task>)
n_envs: 8
n_steps: 1024             # rollout length per env
batch_size: 2048
gamma: 0.98               # ~1 s horizon at 50 Hz
learning_rate: 3e-4
ent_coef: 0.0
log_std_init: -1.6        # initial action std 0.2
net_arch: [128, 128]
